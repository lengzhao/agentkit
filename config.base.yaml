# L0 默认配置：随 agentkit 发布，用户通过 config.yaml（L1）按 instance id 整颗覆盖。
# workspace 提供 global（~/.agentkit）与 local（默认 .agentkit）两个根；默认 scope=global。
# 路径可用 global:rel / local:rel 前缀显式指定根；skills 等可按需叠加多个目录。
# API Key 通过环境变量注入：export OPENAI_API_KEY=sk-...

workspace.default:
  use: workspace/default
  config:
    global: ~/.agentkit
    local: .agentkit
    scope: local

# 进程启动前在 workspace 目录按序执行 shell 命令（幂等）；挂到 runner.deps.init
bootstrap.shell.default:
  use: bootstrap/shell
  config:
    workDir: local:.
    commands:
      - echo "init"
  deps:
    workspace: workspace.default

runner.default:
  use: runner
  config:
    # 关停时等待进行中的 turn 落盘 turn/end 的上限；0 = 无限等。
    shutdownTimeoutSeconds: 10
    # 会话粒度：platform 发 delivery SessionID（最细），runner 折叠后给 Loop 加锁与写历史。
    sessionScope: channel
    # 跨 effective session 的并行 turn 上限。默认 64；同一 session 内始终保序。
    # 单租户 coding CLI 若担心 workspace 写冲突，可在 L1 显式调低。
    maxConcurrentTurns: 64
    # 入站 user 消息 prepend [meta sender_id=... sender_name="..." timestamp="..."]。
    inject:
      - sender_id
      - sender_name
      - timestamp
  deps:
    platform: platform.default
    loop: loop.default
    sessionStore: sessionStore.default
    telemetry: telemetry.default
    schedules:
      - schedule.cron
    # 启动前一次性初始化（AppInitializer）；示例见 bootstrap.shell.default
    init:
      - bootstrap.shell.default

# 默认聚合 CLI + 可选 IM（Slack / 飞书 / Lark）。未配置对应环境变量时，loader 自动清理该平台实例。
platform.default:
  use: platform/multiplex
  deps:
    platforms:
      - platform.cli
      - platform.slack
      - platform.feishu
      - platform.lark
      - platform.chat-api

platform.cli:
  use: platform/cli
  config:
    once: false
  deps:
    commands: commands.default
    sessionStore: sessionStore.default

# Slack Socket Mode。凭证：SLACK_BOT_TOKEN + SLACK_APP_TOKEN
platform.slack:
  use: platform/slack
  config:
    botTokenRef: ${env:SLACK_BOT_TOKEN}
    appTokenRef: ${env:SLACK_APP_TOKEN}
    allowFrom: "" # 用户 ID 白名单，逗号分隔（如 UAAA,UBBB）；空或 * = 全部
    # allowChannels: "" # 频道白名单（ID 或 #name，逗号分隔）；空或 * = 全部；私信不受限
    groupReplyAll: false
  deps:
    commands: commands.default
    sessionStore: sessionStore.default
    credentials: credentials.default
    workspace: workspace.default

# 飞书 WebSocket（国内）。凭证：FEISHU_APP_ID + FEISHU_APP_SECRET
platform.feishu:
  use: platform/feishu
  config:
    appId: ${var:FEISHU_APP_ID}
    appSecret: ${var:FEISHU_APP_SECRET}
    allowFrom: "" # 用户 open_id 白名单，逗号分隔（如 ou_aaa,ou_bbb）；空或 * = 全部
    allowChat: "" # 群聊 chat_id 白名单，逗号分隔（如 oc_xxx,oc_yyy）；空或 * = 全部；仅群聊生效
    groupReplyAll: false
  deps:
    commands: commands.default
    sessionStore: sessionStore.default
    workspace: workspace.default

# 国际版 Lark。凭证：LARK_APP_ID + LARK_APP_SECRET
platform.lark:
  use: platform/lark
  config:
    appId: ${var:LARK_APP_ID}
    appSecret: ${var:LARK_APP_SECRET}
    allowFrom: "" # 用户 open_id 白名单，逗号分隔（如 ou_aaa,ou_bbb）；空或 * = 全部
    allowChat: "" # 群聊 chat_id 白名单，逗号分隔（如 oc_xxx,oc_yyy）；空或 * = 全部；仅群聊生效
    groupReplyAll: false
  deps:
    commands: commands.default
    sessionStore: sessionStore.default
    workspace: workspace.default

# HTTP + SSE（BFF / 调试台）。加入 platform.default.deps.platforms 或与 platform/http 组合（listenAddr: "-" 由 http 监听）。
platform.chat-api:
  use: platform/chat-api
  config:
    listenAddr: ""
    path: /v1/
    apiToken: ${var:CHAT_API_TOKEN:-}              # Bearer 鉴权；空=不校验（仅内网调试）
    # userHeader: X-Chat-API-User
    # userNameHeader: X-Chat-API-User-Name  # 自动写入 Metadata（sender_name inject）
    # channelHeader: X-Chat-API-Channel
    metadataHeaders:
      - x-task-id                   # 框架默认已内置；可追加自定义头
    busyPolicy: queue
    interactionTimeout: 10m
    # agents: ["assistant", "worker"]  # 可选：调试页 Agent 下拉白名单
    # interactive: true            # false = 无人值守 BFF，ask_user 降级 NoHuman
    debugUi: false
  deps:
    commands: commands.default
    sessionStore: sessionStore.default
    workspace: workspace.default

platform.http:
  use: platform/http
  config:
    listenAddr: ":8080"

# ACP Agent（stdio JSON-RPC）。供 Zed、ACP 客户端以子进程方式接入；stdout 仅协议流量，日志走 stderr。
platform.acp:
  use: platform/acp
  config:
    agentName: agentkit
    agentVersion: "0.1.0"
  deps:
    workspace: workspace.default

commands.default:
  use: commands/registry
  # config:
  #   admins: [U02ABC]
  #   adminOnly: [shell, sh, cron, env, mcp, openapi, send]

loop.default:
  use: loop/default
  deps:
    agents:
      - agent.assistant.default
      - agent.worker.default
      - agent.cursor.default
    telemetry: telemetry.default

telemetry.default:
  use: telemetry/none

agent.assistant.default:
  use: agent/coding
  config:
    id: assistant
    model: gpt-5.4
    maxSteps: 20
    retry:
      enabled: true
      maxRetries: 3
      baseDelayMs: 2000
  deps:
    sessionStore: sessionStore.default
    llm: llm.fallback
    hooks: hooks.default
    prompt: prompt.default
    tools: tools.default
    workspace: workspace.default
    compaction:
      - compaction.prune.default
      - compaction.token-limit.default

# 工作模式 agent：自主续跑直到 todo 完成并 finish。通过 /agent use worker 或 chat-api agent_id=worker 触发。
agent.worker.default:
  use: agent/coding
  config:
    id: worker
    model: gpt-5.4
    maxSteps: 20
    budget:
      maxContinuations: 30
      maxTotalSteps: 300
      wallClockSeconds: 7200
      maxTotalTokens: 2000000
      softRatio: 0.8
    retry:
      enabled: true
      maxRetries: 3
      baseDelayMs: 2000
  deps:
    sessionStore: sessionStore.default
    llm: llm.fallback
    hooks: hooks.worker
    prompt: prompt.worker.default
    tools: tools.worker.default
    workspace: workspace.default
    compaction:
      - compaction.prune.default
      - compaction.token-limit.worker

# 通过 ACP 调用 Cursor CLI（agent acp）。需先在本机完成 agent login；子进程注入 NO_OPEN_BROWSER=1（见 docs/plugin-catalog.zh.md §3.2）。
agent.cursor.default:
  use: agent/acp-remote
  config:
    id: cursor
    command:
      - agent
      - acp
    authMethod: cursor_login
    env:
      NO_OPEN_BROWSER: "1"
      CURSOR_ENABLE: ${var:CURSOR_ENABLE}
    autoApprove: false
  deps:
    workspace: workspace.default
    sessionStore: sessionStore.default

sessionStore.default:
  use: session/store
  config:
    dir: sessions
    maxCachedSessions: 64
    cacheIdleTTL: 30m
    maxLoadedEvents: 256
  deps:
    workspace: workspace.default

# cron job 表持久化；schedule/cron 与 tool/schedule 共用此 registry。
# 写入走临时文件 + rename，进程写一半被杀不会留下截断的 job 表。
schedule.default:
  use: schedule/multi
  config:
    # 全局一份 schedule.json；list/remove 按 channel 过滤。
    path: global:schedules/schedule.json
  deps:
    workspace: workspace.default

# 常驻日历调度：与 tool/schedule 共用 registry，agent 排的 job 跨重启存活。
schedule.cron:
  use: schedule/cron
  config:
    jobs: []
    sessionMode: stateless
    sessionID: schedule
    pollSeconds: 15
  deps:
    schedule: schedule.default
    workspace: workspace.default

# 子 agent 委派：定义在 local:agents / global:agents 下的 agents/*.md。
# 子 agent 必须用不含 tool/subagent 的兄弟 tools/prompt 实例，既断依赖环，也让"只有主 agent 能委派"成为结构性事实。
subagent.default:
  use: subagent/inprocess
  config:
    dirs:
      - local:agents
      - global:agents
    maxSteps: 20
    timeoutSeconds: 600
  deps:
    workspace: workspace.default
    sessionStore: sessionStore.default
    llm: llm.fallback
    tools: tools.subagent.default
    prompt: prompt.subagent.default
    hooks: hooks.default
    compaction:
      - compaction.prune.default
      - compaction.token-limit.default

credentials.default:
  use: credentials/env
  config:
    files:
      - global:.env
  deps:
    workspace: workspace.default

llm.default:
  use: llm/openai-compatible
  config:
    model: gpt-5.4
    baseUrl: https://api.openai.com/v1
    apiKeyRef: env:OPENAI_API_KEY
    api: chat
    # hostedTools:
    #   - type: web_search
    #     parameters:
    #       search_context_size: low
    retry:
      provider:
        maxRetries: 0
        maxRetryDelayMs: 60000
  deps:
    credentials: credentials.default

llm.fallback:
  use: llm/fallback
  config:
    fallbackModels:
      - gpt-4o
      - gpt-4o-mini
  deps:
    provider: llm.default

hooks.default:
  use: hooks/runtime
  deps:
    providers:
      - hook.before-step.default
      - hook.turn-continue.default

# worker 长跑：按 token 阈值更早触发压缩（triggerRatio 0.7）。
hooks.worker:
  use: hooks/runtime
  deps:
    providers:
      - hook.before-step.worker
      - hook.turn-continue.default

hook.before-step.default:
  use: hook/before-step
  config:
    contributeCommands: true
  deps:
    sessionStore: sessionStore.default
    services:
      - compaction.prune.default
      - compaction.token-limit.default

hook.before-step.worker:
  use: hook/before-step
  deps:
    sessionStore: sessionStore.default
    services:
      - compaction.prune.default
      - compaction.token-limit.worker

hook.turn-continue.default:
  use: hook/turn-continue
  config:
    maxContinuations: 30
    stallLimit: 3
    requireFinish: true
    requireTodosDone: true
  deps:
    sessionStore: sessionStore.default

compaction.prune.default:
  use: compaction/prune-tool-results
  config:
    maxToolResultBytes: 8192

compaction.summary.default:
  use: compaction/summary
  config:
    summaryModel: gpt-5.4
    keepRecentTokens: 20000
    reserveTokens: 16384
    retry:
      enabled: true
      maxRetries: 3
      baseDelayMs: 2000
  deps:
    llm: llm.fallback

compaction.token-limit.default:
  use: compaction/token-limit
  config:
    contextWindow: 200000
    triggerRatio: 0.92
    charsPerToken: 3
  deps:
    services:
      - compaction.summary.default

compaction.token-limit.worker:
  use: compaction/token-limit
  config:
    contextWindow: 200000
    triggerRatio: 0.7
    charsPerToken: 3
  deps:
    services:
      - compaction.summary.default

prompt.default:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.persona.default
      - prompt.agents-md.default
      - prompt.memory.default
      - prompt.skills.default
      - prompt.subagents.default

prompt.persona.default:
  use: prompt/section/static
  config:
    name: persona
    content: |
      你是「智能助手」，一名全能、可靠的个人与工作助理。

      ## 角色定位
      - 帮助用户理解问题、获取信息、组织思路并完成各类任务
      - 既能回答常识与专业知识，也能协助写作、分析、规划、编程、调试与文档整理
      - 在用户工作区内可使用工具查阅文件、执行命令、搜索网络、调用技能与子任务能力

      ## 性格与风格
      - 友善、耐心、务实，不夸张、不端架子
      - 回答清晰有条理，根据问题复杂度调整详略
      - 默认使用中文；用户用其他语言提问时用同语言回复
      - 不确定时如实说明，必要时主动澄清需求，而不是编造

      ## 工作原则
      - 先理解用户真正目标，再给可执行的方案或直接结果
      - 涉及事实、数据、代码时优先核对依据，必要时使用工具验证
      - 能一步做完的不拆成多步；需要多步时说明计划并持续推进
      - 尊重用户偏好与时间：简洁问题简洁答，复杂任务结构化呈现
      - 涉及破坏性操作（删除、覆盖、执行有风险命令）前先确认

      ## 定时与提醒
      - 用户要求「N 分钟后提醒」「每天几点」等定时任务时，必须用 schedule 工具排期；未调用 schedule 就不要声称已设置提醒
      - 相对延时（如「1 分钟后」）用 schedule op=add kind=delay in=1m；prompt 只写提醒内容，触发后框架会注入定时前缀
      - 重复任务（如「每天 9 点」）用 schedule op=add kind=cron cron="0 9 * * *"
      - 用户也可用 /cron 查看当前 channel 的定时任务；/cron remove <id> 取消
      - 触发后在新 turn 里用 send 把提醒发回用户即可

      ## 边界
      - 不假装拥有用户未提供的实时信息；需要时用搜索或工具获取
      - 不提供违法、有害或明显不当内容的协助
      - 工具失败时说明原因并给出替代方案，而不是静默放弃

prompt.worker.default:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.persona.worker
      - prompt.agents-md.default
      - prompt.memory.default
      - prompt.skills.default
      - prompt.subagents.default

prompt.persona.worker:
  use: prompt/section/static
  config:
    name: persona
    content: |
      你是「工作助手」（worker），负责把用户交代的任务从头到尾做完，而不是只做一轮问答。

      ## 工作方式
      - 收到任务后先用 todo 拆成可执行步骤，并标记当前进行项
      - 持续推进：读文件、搜索、执行命令、验证结果，直到全部完成或明确受阻
      - 全部完成或无法继续时，必须调用 finish（status=completed 或 blocked，summary 写清成果与遗留项）
      - 不要停在「我建议你…」就结束；能自己做的就自己做

      ## 风格
      - 默认中文；进展与结论结构化、可核对
      - 涉及事实与代码时优先用工具验证，不编造
      - 破坏性操作前用 ask_user 确认（若平台支持交互）

      ## 边界
      - 工具失败时说明原因并换方案，不静默放弃
      - 不提供违法、有害内容的协助

prompt.subagents.default:
  use: prompt/section/subagents
  deps:
    subagent: subagent.default

# 子 agent 的 prompt：共享 AGENTS.md 与 skills，不含可委派名单。
prompt.subagent.default:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.agents-md.default
      - prompt.skills.default

prompt.agents-md.default:
  use: prompt/section/agents-md
  deps:
    workspace: workspace.default

learning.default:
  use: learning/default
  config:
    dreaming:
      enabled: true
    workshop:
      mode: propose

# 可选：后台 dreaming sweep（与 schedule/cron 并列由 runner 启动）
# learning.dreamSweep:
#   use: learning/dream-sweep
#   deps:
#     learning: learning.default
  deps:
    workspace: workspace.default
    sessionStore: sessionStore.default

prompt.memory.default:
  use: prompt/section/memory
  deps:
    workspace: workspace.default
    learning: learning.default

prompt.skills.default:
  use: prompt/section/skills
  deps:
    skills: skills.default

skills.default:
  use: skill/filesystem
  config:
    dirs:
      - local:../skills
      - local:skills
      - global:skills
  deps:
    workspace: workspace.default

tools.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
    # 子 agent 要跑多步，delegate 单独放宽墙钟上限。
    toolTimeouts:
      delegate: 900
      # 人不是 120s 内一定会回话的。
      ask_user: 900
  deps:
    hooks: hooks.default
    tools:
      - tool.shell-bash.default
      - tool.skill.default
      - tool.subagent.default
      - tool.web-fetch-http.default
      - tool.ask-user.default
      - tool.send.default
      - tool.chat-history.default
      - tool.schedule.default
    toolPacks:
      - tool.fs-workspace.default
    dynamicTools:
      - mcp.default
      - openapi.default
    policies:
      - policy.dangerous-shell.default

tools.worker.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
    toolTimeouts:
      delegate: 900
      ask_user: 900
  deps:
    hooks: hooks.worker
    tools:
      - tool.shell-bash.default
      - tool.skill.default
      - tool.subagent.default
      - tool.web-fetch-http.default
      - tool.ask-user.default
      - tool.send.default
      - tool.chat-history.default
      - tool.schedule.default
      - tool.todo.default
      - tool.finish.default
    toolPacks:
      - tool.fs-workspace.default
    dynamicTools:
      - mcp.default
      - openapi.default
    policies:
      - policy.dangerous-shell.default

# 子 agent 的工具集：只读 + web 抓取 + finish，不含 delegate。搜索由 llm.default.hostedTools 提供。
tools.subagent.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
  deps:
    hooks: hooks.default
    tools:
      - tool.finish.default
      - tool.web-fetch-http.default
    toolPacks:
      - tool.fs-workspace.readonly.default
    policies:
      - policy.dangerous-shell.default

# scope 默认根放 runtime（sessions、AGENTS.md、memory.md 等）；fs/shell 只在 work/ 读写临时产物。
tool.fs-workspace.default:
  use: tool/fs-workspace
  config:
    root: work
    # unrestricted: true  # 关闭路径权限控制，不限于 root（含 ../、绝对路径等）
    tenantFiles:
      - AGENTS.md
      - AGENTS.MD
      - CLAUDE.md
      - memory.md
      - MEMORY.md
      - DREAMS.md
    maxBytes: 1048576
  deps:
    workspace: workspace.default

tool.fs-workspace.readonly.default:
  use: tool/fs-workspace
  config:
    root: work
    tenantFiles:
      - AGENTS.md
      - AGENTS.MD
      - CLAUDE.md
      - memory.md
      - MEMORY.md
      - DREAMS.md
    maxBytes: 1048576
    readOnly: true
    tools:
      - read
      - grep
      - find
      - ls
  deps:
    workspace: workspace.default

tool.shell-bash.default:
  use: tool/shell-bash
  config:
    workDir: work
    timeoutSeconds: 60
  deps:
    workspace: workspace.default

tool.skill.default:
  use: tool/skill
  deps:
    skills: skills.default
    sessionStore: sessionStore.default

tool.schedule.default:
  use: tool/schedule
  config:
    maxJobs: 32
  deps:
    schedule: schedule.default

tool.subagent.default:
  use: tool/subagent
  deps:
    subagent: subagent.default

tool.todo.default:
  use: tool/todo
  deps:
    sessionStore: sessionStore.default

tool.finish.default:
  use: tool/finish
  deps:
    sessionStore: sessionStore.default

tool.web-fetch-http.default:
  use: tool/web-fetch-http
  config:
    timeoutSeconds: 30
    maxBytes: 1048576
    maxRedirects: 5
    allowPrivateHosts: false

tool.web-search.default:
  use: tool/web-search-auto
  config:
    maxResults: 5
    snippetChars: 800
    tavily:
      apiKeyRef: env:TAVILY_API_KEY
      searchDepth: basic
    duckduckgo: {}
  deps:
    credentials: credentials.default

tool.web-search-tavily.default:
  use: tool/web-search-tavily
  config:
    apiKeyRef: env:TAVILY_API_KEY
    maxResults: 5
    searchDepth: basic
    snippetChars: 800
  deps:
    credentials: credentials.default

tool.web-search-exa.default:
  use: tool/web-search-exa
  config:
    apiKeyRef: env:EXA_API_KEY
    maxResults: 5
    includeText: false
    snippetChars: 800
  deps:
    credentials: credentials.default

tool.ask-user.default:
  use: tool/ask-user

tool.send.default:
  use: tool/send
  deps:
    platform: platform.default
    workspace: workspace.default

tool.chat-history.default:
  use: tool/chat-history
  deps:
    platform: platform.default

mcp.default:
  use: tool/mcp
  config:
    files:
      - global:mcp.json
    idleTimeoutSeconds: 300
  deps:
    workspace: workspace.default
    credentials: credentials.default

openapi.default:
  use: tool/openapi
  config:
    files:
      - global:api.json
  deps:
    workspace: workspace.default
    credentials: credentials.default

policy.dangerous-shell.default:
  use: policy/deny-dangerous-shell
