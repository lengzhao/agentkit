# L0 默认配置：随 agentkit 发布，用户通过 config.yaml（L1）按 instance id 整颗覆盖。
# workspace 提供 global（~/.agentkit）与 local（当前目录）两个根；默认 scope=global。
# 路径可用 global:rel / local:rel 前缀显式指定根；skills 等可按需叠加多个目录。
# API Key 通过环境变量注入：export OPENAI_API_KEY=sk-...

workspace.default:
  use: workspace/default
  config:
    global: ~/.agentkit
    local: .agentkit
    scope: global

runner.default:
  use: runner
  config:
    # 关停时等待进行中的 turn 落盘 turn/end 的上限；0 = 无限等。
    shutdownTimeoutSeconds: 10
    # 同时运行的 turn 上限。默认 1（串行）：不同 session 的 turn 共享同一个工作区，
    # 两个 agent 并发跑 go build 或改同一个文件是真实风险。
    # 会话之间真正独立的传输（IM、HTTP）再往上调；同一 session 内的顺序始终保证。
    maxConcurrentTurns: 1
  deps:
    platform: platform.default
    loop: loop.default

platform.default:
  use: platform/cli
  config:
    once: false
  deps:
    commands: commands.default

commands.default:
  use: commands/registry

loop.default:
  use: loop/default
  deps:
    agents:
      - agent.coder.default

agent.coder.default:
  use: agent/coding
  config:
    id: coder
    model: gpt-5.4
    maxSteps: 20
    retry:
      enabled: true
      maxRetries: 3
      baseDelayMs: 2000
  deps:
    sessionStore: sessionStore.default
    llm: llm.default
    hooks: hooks.default
    prompt: prompt.default
    tools: tools.default
    compaction:
      - compaction.prune.default
      - compaction.summary.default

sessionStore.default:
  use: session/store
  config:
    dir: sessions
  deps:
    workspace: workspace.default

# cron job 表持久化；worker 的 cron 模式与 tool/schedule 共用此 registry。
# 写入走临时文件 + rename，进程写一半被杀不会留下截断的 job 表。
schedule.default:
  use: schedule/file
  config:
    path: schedule.json
  deps:
    workspace: workspace.default

# 子 agent 委派：定义在 local:agents / global:agents 下的 agents/*.md。
# 子 agent 必须用不含 tool/subagent 的兄弟 tools/prompt 实例，既断依赖环，也让"只有主 agent 能委派"成为结构性事实。
subagent.default:
  use: subagent/inprocess
  config:
    dirs:
      - local:agents
      - global:agents
    maxSteps: 20
    timeoutSeconds: 600
  deps:
    workspace: workspace.default
    sessionStore: sessionStore.default
    llm: llm.default
    tools: tools.subagent.default
    prompt: prompt.subagent.default
    hooks: hooks.default
    compaction:
      - compaction.prune.default
      - compaction.summary.default

credentials.default:
  use: credentials/env

llm.default:
  use: llm/openai-compatible
  config:
    model: gpt-5.4
    baseUrl: https://api.openai.com/v1
    apiKeyRef: env:OPENAI_API_KEY
    api: chat
    retry:
      provider:
        maxRetries: 0
        maxRetryDelayMs: 60000
  deps:
    credentials: credentials.default

hooks.default:
  use: hooks/runtime
  deps:
    providers:
      - hook.before-step.default

hook.before-step.default:
  use: hook/before-step
  deps:
    sessionStore: sessionStore.default
    services:
      - compaction.prune.default
      - compaction.summary.default

compaction.prune.default:
  use: compaction/prune-tool-results
  config:
    maxToolResultBytes: 8192

compaction.summary.default:
  use: compaction/summary
  config:
    minMessages: 30
    keepRecent: 8
    retry:
      enabled: true
      maxRetries: 3
      baseDelayMs: 2000
  deps:
    llm: llm.default

prompt.default:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.agents-md.default
      - prompt.skills.default
      - prompt.subagents.default

prompt.subagents.default:
  use: prompt/section/subagents
  deps:
    subagent: subagent.default

# 子 agent 的 prompt：共享 AGENTS.md 与 skills，不含可委派名单。
prompt.subagent.default:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.agents-md.default
      - prompt.skills.default

prompt.agents-md.default:
  use: prompt/section/agents-md
  config:
    root: .
  deps:
    workspace: workspace.default

prompt.skills.default:
  use: prompt/section/skills
  deps:
    skills: skills.default

skills.default:
  use: skill/filesystem
  config:
    dirs:
      - local:skills
      - global:skills
  deps:
    workspace: workspace.default

tools.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
    # 子 agent 要跑多步，delegate 单独放宽墙钟上限。
    toolTimeouts:
      delegate: 900
      # 人不是 120s 内一定会回话的。
      ask_user: 900
  deps:
    hooks: hooks.default
    tools:
      - tool.read-file.default
      - tool.write-file.default
      - tool.edit-file.default
      - tool.grep.default
      - tool.find.default
      - tool.list-dir.default
      - tool.shell.default
      - tool.skill.default
      - tool.subagent.default
      - tool.web-fetch.default
      - tool.web-search.default
      - tool.ask-user.default
    policies:
      - policy.dangerous-shell.default
    approval: approval.cli.default

# 子 agent 的工具集：只读 + finish，不含 delegate。
tools.subagent.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
  deps:
    hooks: hooks.default
    tools:
      - tool.read-file.default
      - tool.grep.default
      - tool.find.default
      - tool.list-dir.default
      - tool.finish.default
      - tool.web-fetch.default
      - tool.web-search.default
    policies:
      - policy.dangerous-shell.default
    approval: approval.cli.default

tool.read-file.default:
  use: tool/read-file
  config:
    maxBytes: 1048576
  deps:
    fs: fs.workspace.readonly.default

tool.write-file.default:
  use: tool/write-file
  deps:
    fs: fs.workspace.default

tool.edit-file.default:
  use: tool/edit-file
  deps:
    fs: fs.workspace.default

tool.grep.default:
  use: tool/grep
  deps:
    fs: fs.workspace.readonly.default

tool.find.default:
  use: tool/find
  deps:
    fs: fs.workspace.readonly.default

tool.list-dir.default:
  use: tool/list-dir
  deps:
    fs: fs.workspace.readonly.default

tool.shell.default:
  use: tool/shell
  deps:
    shell: shell.bash.default

tool.skill.default:
  use: tool/skill
  deps:
    skills: skills.default
    sessionStore: sessionStore.default

tool.schedule.default:
  use: tool/schedule
  config:
    # agent 创建的 job 上限；0 表示默认 32。config 里声明的 job 不占此额度。
    maxJobs: 32
  deps:
    schedule: schedule.default

tool.subagent.default:
  use: tool/subagent
  deps:
    subagent: subagent.default

tool.finish.default:
  use: tool/finish
  deps:
    sessionStore: sessionStore.default

# 抓取与搜索是两个 cap（web.Fetcher / web.Searcher）：没配 EXA_API_KEY 时抓取仍可用，
# 搜索在调用时返回模型可读的"没有 key"而不是阻断构造。
web.fetch.default:
  use: web/http-fetch
  config:
    timeoutSeconds: 30
    maxBytes: 1048576
    maxRedirects: 5
    # 打开它等于允许 agent 访问 127.0.0.1 / 10.0.0.0/8 等私网地址。
    allowPrivateHosts: false

web.search.default:
  use: web/exa-search
  config:
    apiKeyRef: env:EXA_API_KEY
    maxResults: 5
    includeText: false
    snippetChars: 800
  deps:
    credentials: credentials.default

ask.default:
  use: ask/cli
  config:
    prefix: "[agent asks]"

tool.web-fetch.default:
  use: tool/web-fetch
  deps:
    web: web.fetch.default

tool.web-search.default:
  use: tool/web-search
  config:
    maxResults: 5
  deps:
    web: web.search.default

tool.ask-user.default:
  use: tool/ask-user
  deps:
    ask: ask.default

fs.workspace.default:
  use: fs/local
  config:
    root: .
  deps:
    workspace: workspace.default

fs.workspace.readonly.default:
  use: fs/readonly
  deps:
    fs: fs.workspace.default

shell.bash.default:
  use: shell/bash
  config:
    workDir: .
    timeoutSeconds: 60
  deps:
    workspace: workspace.default

policy.dangerous-shell.default:
  use: policy/deny-dangerous-shell

approval.cli.default:
  use: approval/cli
