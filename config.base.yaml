# L0 默认配置：随 agentkit 发布，用户通过 config.yaml（L1）按 instance id 整颗覆盖。
# workspace 提供 global（~/.agentkit）与 local（默认 .agentkit）两个根；默认 scope=global。
# 路径可用 global:rel / local:rel 前缀显式指定根；skills 等可按需叠加多个目录。
# API Key 通过环境变量注入：export OPENAI_API_KEY=sk-...

workspace.default:
  use: workspace/default
  config:
    global: ~/.agentkit
    local: .agentkit
    scope: global

runner.default:
  use: runner
  config:
    # 关停时等待进行中的 turn 落盘 turn/end 的上限；0 = 无限等。
    shutdownTimeoutSeconds: 10
    # 同时运行的 turn 上限。默认 1（串行）：不同 session 的 turn 共享同一个工作区，
    # 两个 agent 并发跑 go build 或改同一个文件是真实风险。
    # 会话之间真正独立的传输（IM、HTTP）再往上调；同一 session 内的顺序始终保证。
    maxConcurrentTurns: 1
  deps:
    platform: platform.default
    loop: loop.default

platform.default:
  use: platform/cli
  config:
    once: false
  deps:
    commands: commands.default
    sessionStore: sessionStore.default

commands.default:
  use: commands/registry

loop.default:
  use: loop/default
  deps:
    agents:
      - agent.coder.default

agent.coder.default:
  use: agent/coding
  config:
    id: coder
    model: gpt-5.4
    maxSteps: 20
    retry:
      enabled: true
      maxRetries: 3
      baseDelayMs: 2000
  deps:
    sessionStore: sessionStore.default
    llm: llm.default
    hooks: hooks.default
    prompt: prompt.default
    tools: tools.default
    compaction:
      - compaction.prune.default
      - compaction.summary.default

sessionStore.default:
  use: session/store
  config:
    dir: sessions
  deps:
    workspace: workspace.default

# cron job 表持久化；worker 的 cron 模式与 tool/schedule 共用此 registry。
# 写入走临时文件 + rename，进程写一半被杀不会留下截断的 job 表。
schedule.default:
  use: schedule/file
  config:
    path: schedule.json
  deps:
    workspace: workspace.default

# 子 agent 委派：定义在 local:agents / global:agents 下的 agents/*.md。
# 子 agent 必须用不含 tool/subagent 的兄弟 tools/prompt 实例，既断依赖环，也让"只有主 agent 能委派"成为结构性事实。
subagent.default:
  use: subagent/inprocess
  config:
    dirs:
      - local:agents
      - global:agents
    maxSteps: 20
    timeoutSeconds: 600
  deps:
    workspace: workspace.default
    sessionStore: sessionStore.default
    llm: llm.default
    tools: tools.subagent.default
    prompt: prompt.subagent.default
    hooks: hooks.default
    compaction:
      - compaction.prune.default
      - compaction.summary.default

credentials.default:
  use: credentials/env

llm.default:
  use: llm/openai-compatible
  config:
    model: gpt-5.4
    baseUrl: https://api.openai.com/v1
    apiKeyRef: env:OPENAI_API_KEY
    api: chat
    retry:
      provider:
        maxRetries: 0
        maxRetryDelayMs: 60000
  deps:
    credentials: credentials.default

hooks.default:
  use: hooks/runtime
  deps:
    providers:
      - hook.before-step.default

hook.before-step.default:
  use: hook/before-step
  deps:
    sessionStore: sessionStore.default
    services:
      - compaction.prune.default
      - compaction.summary.default

compaction.prune.default:
  use: compaction/prune-tool-results
  config:
    maxToolResultBytes: 8192

compaction.summary.default:
  use: compaction/summary
  config:
    minMessages: 30
    keepRecent: 8
    retry:
      enabled: true
      maxRetries: 3
      baseDelayMs: 2000
  deps:
    llm: llm.default

prompt.default:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.agents-md.default
      - prompt.skills.default
      - prompt.subagents.default

prompt.subagents.default:
  use: prompt/section/subagents
  deps:
    subagent: subagent.default

# 子 agent 的 prompt：共享 AGENTS.md 与 skills，不含可委派名单。
prompt.subagent.default:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.agents-md.default
      - prompt.skills.default

prompt.agents-md.default:
  use: prompt/section/agents-md
  config:
    root: work
  deps:
    workspace: workspace.default

prompt.skills.default:
  use: prompt/section/skills
  deps:
    skills: skills.default

skills.default:
  use: skill/filesystem
  config:
    dirs:
      - local:skills
      - global:skills
  deps:
    workspace: workspace.default

tools.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
    # 子 agent 要跑多步，delegate 单独放宽墙钟上限。
    toolTimeouts:
      delegate: 900
      # 人不是 120s 内一定会回话的。
      ask_user: 900
  deps:
    hooks: hooks.default
    tools:
      - tool.fs-workspace.default
      - tool.shell-bash.default
      - tool.skill.default
      - tool.subagent.default
      - tool.web-fetch-http.default
      - tool.web-search-exa.default
      - tool.ask-user.default
    dynamicTools:
      - mcp.default
    policies:
      - policy.dangerous-shell.default

# 子 agent 的工具集：只读 + finish，不含 delegate。
tools.subagent.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
  deps:
    hooks: hooks.default
    tools:
      - tool.fs-workspace.readonly.default
      - tool.finish.default
      - tool.web-fetch-http.default
      - tool.web-search-exa.default
    policies:
      - policy.dangerous-shell.default

# scope 默认根放 runtime（sessions、mcp.json 等）；fs/shell 只在 work/ 子目录读写。
tool.fs-workspace.default:
  use: tool/fs-workspace
  config:
    root: work
    maxBytes: 1048576
  deps:
    workspace: workspace.default

tool.fs-workspace.readonly.default:
  use: tool/fs-workspace
  config:
    root: work
    maxBytes: 1048576
    readOnly: true
    tools:
      - read
      - grep
      - find
      - ls
  deps:
    workspace: workspace.default

tool.shell-bash.default:
  use: tool/shell-bash
  config:
    workDir: work
    timeoutSeconds: 60
  deps:
    workspace: workspace.default

tool.skill.default:
  use: tool/skill
  deps:
    skills: skills.default
    sessionStore: sessionStore.default

tool.schedule.default:
  use: tool/schedule
  config:
    maxJobs: 32
  deps:
    schedule: schedule.default

tool.subagent.default:
  use: tool/subagent
  deps:
    subagent: subagent.default

tool.finish.default:
  use: tool/finish
  deps:
    sessionStore: sessionStore.default

tool.web-fetch-http.default:
  use: tool/web-fetch-http
  config:
    timeoutSeconds: 30
    maxBytes: 1048576
    maxRedirects: 5
    allowPrivateHosts: false

tool.web-search-exa.default:
  use: tool/web-search-exa
  config:
    apiKeyRef: env:EXA_API_KEY
    maxResults: 5
    includeText: false
    snippetChars: 800
  deps:
    credentials: credentials.default

tool.ask-user.default:
  use: tool/ask-user

mcp.default:
  use: tool/mcp
  config:
    files:
      - .cursor/mcp.json
      - global:mcp.json
  deps:
    workspace: workspace.default
    credentials: credentials.default

policy.dangerous-shell.default:
  use: policy/deny-dangerous-shell
