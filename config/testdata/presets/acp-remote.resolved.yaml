agent.acp.default:
    config:
        authMethod: cursor_login
        autoApprove: false
        command:
            - agent
            - acp
        env:
            NO_OPEN_BROWSER: "1"
        id: acp
    deps:
        fs: filesystem.local.state
        sessionEvents: session.events
        sessionStore: sessionStore.default
        telemetry: telemetry.toolkit
        workspace: workspace.default
    use: agent/acp-remote
bootstrap.shell.default:
    config:
        commands:
            - echo "init"
        workDir: local:work
    deps:
        workspace: workspace.default
    use: bootstrap/shell
filesystem.local.state:
    config:
        root: .
        unrestricted: true
    deps:
        workspace: workspace.default
    use: filesystem/local
learning.default:
    config:
        dreaming:
            enabled: true
            feedReview: true
            feedReviewTopK: 8
        workshop:
            mode: propose
    deps:
        engine: schedule.engine
        fs: filesystem.local.state
        memory: memory.default
        sessionStore: sessionStore.default
        workspace: workspace.default
    use: learning/default
learning.dreamSweep:
    config:
        pollSeconds: 60
    deps:
        learning: learning.default
    use: learning/dream-sweep
memory.default:
    deps:
        fs: filesystem.local.state
    use: memory/default
runner.default:
    config:
        inject:
            - sender_id
            - sender_name
            - sender_email
            - mentions
            - chat_id
            - timestamp
        maxConcurrentTurns: 64
        sessionScope: channel
        shutdownTimeoutSeconds: 10
    deps:
        init:
            - bootstrap.shell.default
        loop:
            config:
                defaultAgent: acp
            deps:
                agents:
                    - agent.acp.default
            use: loop/default
        platform:
            config:
                once: false
            use: platform/cli
        schedules:
            - schedule.cron
            - learning.dreamSweep
        sessionStore: sessionStore.default
        telemetry: telemetry.default
        workspace: workspace.default
    use: runner
schedule.cron:
    config:
        jobs: []
        pollSeconds: 15
        sessionID: schedule
        sessionMode: stateless
    deps:
        engine: schedule.engine
        schedule: schedule.default
        shell: tool.shell-bash.scheduled
        workspace: workspace.default
    use: schedule/cron
schedule.default:
    config:
        path: global:schedule.json
    deps:
        engine: schedule.engine
        fs: filesystem.local.state
    use: schedule/multi
schedule.engine:
    use: schedule/engine
session.default:
    config:
        id: cli:default
    use: session/memory
session.events:
    use: session/events
sessionStore.default:
    deps:
        session: session.default
    use: session/static
telemetry.default:
    use: telemetry/none
telemetry.toolkit:
    use: telemetry/toolkit
tool.shell-bash.scheduled:
    config:
        timeoutSeconds: 300
        trimEnv: true
        workDir: work
    deps:
        workspace: workspace.default
    use: tool/shell-bash
workspace.default:
    config:
        global: ~/.agentkit
        local: .agentkit
        scope: local
        uploadSubdir: upload
        workDir: work
    use: workspace/default
