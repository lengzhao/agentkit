bootstrap.shell.default:
    config:
        commands:
            - echo "init"
        workDir: local:work
    deps:
        workspace: workspace.default
    use: bootstrap/shell
credentials.integrations:
    config:
        encryptedFile: global:secrets.enc.json
    deps:
        fs: filesystem.local.state
    use: credentials/integrations
filesystem.local.state:
    config:
        root: .
        unrestricted: true
    deps:
        workspace: workspace.default
    use: filesystem/local
learning.default:
    config:
        dreaming:
            enabled: true
            feedReview: true
            feedReviewTopK: 8
        workshop:
            mode: propose
    deps:
        engine: schedule.engine
        fs: filesystem.local.state
        memory: memory.default
        sessionStore: sessionStore.default
        workspace: workspace.default
    use: learning/default
learning.dreamSweep:
    config:
        pollSeconds: 60
    deps:
        learning: learning.default
    use: learning/dream-sweep
memory.default:
    deps:
        fs: filesystem.local.state
    use: memory/default
runner.default:
    config:
        inject:
            - sender_id
            - sender_name
            - sender_email
            - mentions
            - timestamp
        maxConcurrentTurns: 64
        sessionScope: channel
        shutdownTimeoutSeconds: 10
    deps:
        init:
            - bootstrap.shell.default
        loop:
            deps:
                agents:
                    - config:
                        id: smoke
                      deps:
                        llm:
                            config:
                                steps:
                                    - text: 当前目录内容需要通过 bash 工具列出，然后用 read 读取 README.md
                                      toolCalls:
                                        - id: call-ls
                                          input: '{"command":"ls -la"}'
                                          name: bash
                                    - text: 已完成目录列表。
                                      toolCalls:
                                        - id: call-read
                                          input: '{"path":"README.md"}'
                                          name: read
                                    - text: README 已读取完毕。
                            use: llm/scripted
                        prompt:
                            use: prompt/assembler/default
                        sessionStore: sessionStore.default
                        tools:
                            deps:
                                policies:
                                    - use: policy/deny-dangerous-shell
                                toolPacks:
                                    - config:
                                        files:
                                            README.md: |-
                                                # AgentKit

                                                hello
                                      use: tool/fs-memory
                                tools:
                                    - tool.shell-bash.default
                            use: tools/runtime
                        workspace: workspace.default
                      use: agent/coding
            use: loop/default
        platform:
            config:
                once: true
            use: platform/cli
        schedules:
            - schedule.cron
            - learning.dreamSweep
        sessionStore: sessionStore.default
        telemetry: telemetry.default
        workspace: workspace.default
    use: runner
schedule.cron:
    config:
        jobs: []
        pollSeconds: 15
        sessionID: schedule
        sessionMode: stateless
    deps:
        engine: schedule.engine
        schedule: schedule.default
        workspace: workspace.default
    use: schedule/cron
schedule.default:
    config:
        path: global:schedule.json
    deps:
        engine: schedule.engine
        fs: filesystem.local.state
    use: schedule/multi
schedule.engine:
    use: schedule/engine
session.default:
    config:
        id: cli:default
    use: session/memory
sessionStore.default:
    deps:
        session: session.default
    use: session/static
telemetry.default:
    use: telemetry/none
tool.shell-bash.default:
    config:
        timeoutSeconds: 30
        workDir: .
    deps:
        credentials: credentials.integrations
        workspace: workspace.default
    use: tool/shell-bash
workspace.default:
    config:
        global: ~/.agentkit
        local: .agentkit
        scope: local
        uploadSubdir: upload
        workDir: work
    use: workspace/default
