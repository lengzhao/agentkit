bootstrap.shell.default:
    config:
        commands:
            - echo "init"
        workDir: local:work
    deps:
        workspace: workspace.default
    use: bootstrap/shell
filesystem.local.state:
    config:
        root: .
        unrestricted: true
    deps:
        workspace: workspace.default
    use: filesystem/local
learning.default:
    config:
        dreaming:
            enabled: true
            feedReview: true
            feedReviewTopK: 8
        workshop:
            mode: propose
    deps:
        engine: schedule.engine
        fs: filesystem.local.state
        memory: memory.default
        sessionStore: sessionStore.default
        workspace: workspace.default
    use: learning/default
learning.dreamSweep:
    config:
        pollSeconds: 60
    deps:
        learning: learning.default
    use: learning/dream-sweep
memory.default:
    deps:
        fs: filesystem.local.state
    use: memory/default
platform.default:
    config:
        sessionID: worker
        sessionMode: fixed
        stream: false
        tasks: []
    use: platform/worker
runner.default:
    config:
        inject:
            - sender_id
            - sender_name
            - sender_email
            - mentions
            - timestamp
        maxConcurrentTurns: 64
        sessionScope: channel
        shutdownTimeoutSeconds: 10
    deps:
        init:
            - bootstrap.shell.default
        loop:
            deps:
                agents:
                    - config:
                        id: smoke
                      deps:
                        llm:
                            config:
                                steps:
                                    - text: worker-reply-1
                                    - text: worker-reply-2
                                    - text: worker-reply-3
                            use: llm/scripted
                        prompt:
                            use: prompt/assembler/default
                        sessionStore: sessionStore.default
                        tools:
                            deps:
                                toolPacks:
                                    - config:
                                        files:
                                            README.md: |
                                                # smoke
                                        tools:
                                            - read
                                      use: tool/fs-memory
                            use: tools/runtime
                        workspace: workspace.default
                      use: agent/coding
            use: loop/default
        platform: platform.default
        schedules:
            - schedule.cron
            - learning.dreamSweep
        sessionStore: sessionStore.default
        telemetry: telemetry.default
        workspace: workspace.default
    use: runner
schedule.cron:
    config:
        jobs: []
        pollSeconds: 15
        sessionID: schedule
        sessionMode: stateless
    deps:
        engine: schedule.engine
        schedule: schedule.default
        workspace: workspace.default
    use: schedule/cron
schedule.default:
    config:
        path: global:schedule.json
    deps:
        engine: schedule.engine
        fs: filesystem.local.state
    use: schedule/multi
schedule.engine:
    use: schedule/engine
session.default:
    config:
        id: cli:default
    use: session/memory
sessionStore.default:
    deps:
        session: session.default
    use: session/static
telemetry.default:
    use: telemetry/none
workspace.default:
    config:
        global: ~/.agentkit
        local: .agentkit
        scope: local
        uploadSubdir: upload
        workDir: work
    use: workspace/default
