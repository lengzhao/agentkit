bootstrap.shell.default:
    config:
        commands:
            - echo "init"
        workDir: local:work
    deps:
        workspace: workspace.default
    use: bootstrap/shell
filesystem.local.state:
    config:
        root: .
        unrestricted: true
    deps:
        workspace: workspace.default
    use: filesystem/local
hook.turn-continue.default:
    config:
        maxContinuations: 3
        requireFinish: true
        requireTodosDone: true
        stallLimit: 3
    deps:
        sessionStore: sessionStore.default
    use: hook/turn-continue
hooks.default:
    deps:
        providers:
            - hook.turn-continue.default
    use: hooks/runtime
learning.default:
    config:
        dreaming:
            enabled: true
            feedReview: true
            feedReviewTopK: 8
        workshop:
            mode: propose
    deps:
        engine: schedule.engine
        fs: filesystem.local.state
        memory: memory.default
        sessionStore: sessionStore.default
        workspace: workspace.default
    use: learning/default
learning.dreamSweep:
    config:
        pollSeconds: 60
    deps:
        learning: learning.default
    use: learning/dream-sweep
memory.default:
    deps:
        fs: filesystem.local.state
    use: memory/default
platform.default:
    config:
        once: true
    use: platform/cli
runner.default:
    config:
        inject:
            - sender_id
            - sender_name
            - sender_email
            - mentions
            - chat_id
            - timestamp
        maxConcurrentTurns: 64
        sessionScope: channel
        shutdownTimeoutSeconds: 10
    deps:
        init:
            - bootstrap.shell.default
        loop:
            deps:
                agents:
                    - config:
                        id: smoke
                      deps:
                        hooks: hooks.default
                        llm:
                            config:
                                steps:
                                    - text: 先记录任务清单。
                                      toolCalls:
                                        - id: call-todo-set
                                          input: '{"op":"set","items":[{"id":"1","title":"读取 README","status":"in_progress"},{"id":"2","title":"汇报结论","status":"pending"}]}'
                                          name: todo
                                    - text: 读取 README。
                                      toolCalls:
                                        - id: call-read
                                          input: '{"path":"README.md"}'
                                          name: read
                                    - text: README 已读取，本段先到这里。
                                    - text: 标记任务完成。
                                      toolCalls:
                                        - id: call-todo-done
                                          input: '{"op":"complete","ids":["1","2"]}'
                                          name: todo
                                    - text: 收尾。
                                      toolCalls:
                                        - id: call-finish
                                          input: '{"status":"completed","summary":"读取 README 并汇报结论"}'
                                          name: finish
                                    - text: 全部完成。
                            use: llm/scripted
                        prompt:
                            use: prompt/assembler/default
                        sessionStore: sessionStore.default
                        tools:
                            deps:
                                toolPacks:
                                    - config:
                                        files:
                                            README.md: |-
                                                # AgentKit

                                                hello
                                        tools:
                                            - read
                                      use: tool/fs-memory
                                tools:
                                    - deps:
                                        sessionEvents: session.events
                                        sessionStore: sessionStore.default
                                      use: tool/todo
                                    - deps:
                                        sessionEvents: session.events
                                        sessionStore: sessionStore.default
                                      use: tool/finish
                            use: tools/runtime
                        workspace: workspace.default
                      use: agent/coding
            use: loop/default
        platform: platform.default
        schedules:
            - schedule.cron
            - learning.dreamSweep
        sessionStore: sessionStore.default
        telemetry: telemetry.default
        workspace: workspace.default
    use: runner
schedule.cron:
    config:
        jobs: []
        pollSeconds: 15
        sessionID: schedule
        sessionMode: stateless
    deps:
        engine: schedule.engine
        schedule: schedule.default
        shell: tool.shell-bash.scheduled
        workspace: workspace.default
    use: schedule/cron
schedule.default:
    config:
        path: global:schedule.json
    deps:
        engine: schedule.engine
        fs: filesystem.local.state
    use: schedule/multi
schedule.engine:
    use: schedule/engine
session.default:
    config:
        id: cli:default
    use: session/memory
session.events:
    use: session/events
sessionStore.default:
    deps:
        session: session.default
    use: session/static
telemetry.default:
    use: telemetry/none
tool.shell-bash.scheduled:
    config:
        timeoutSeconds: 300
        trimEnv: true
        workDir: work
    deps:
        workspace: workspace.default
    use: tool/shell-bash
workspace.default:
    config:
        global: ~/.agentkit
        local: .agentkit
        scope: local
        uploadSubdir: upload
        workDir: work
    use: workspace/default
