name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # check-plugin-imports + go vet + go test -race -count=1 ./...
      # (single source of truth: scripts/test.sh)
      - name: Unit and smoke tests
        run: ./scripts/test.sh unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration preset smoke
        run: ./scripts/test.sh integration

  sysint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Real bwrap isolation tests; fails (not skips) when bwrap is unusable.
      - name: Sandbox system-integration tests
        run: ./scripts/test.sh sysint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Coverage (report only, no gate)
        run: ./scripts/test.sh coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
