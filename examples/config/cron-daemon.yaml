# 场景：常驻 cron 守护进程，agent 可自主排期。
# 需链 autonomous：
#
#   go run ./cmd/agent -config examples/config/autonomous.yaml,examples/config/cron-daemon.yaml
#
# task 支持两种模式（互斥）：
#   - prompt：发给 agent 的文本任务
#   - script：工作区内的 bash 脚本，直接执行，不经过 agent

workspace.default:
  use: workspace/default
  config:
    global: ~/.agentkit
    local: .
    scope: local

platform.default:
  use: platform/worker
  config:
    tasks:
      - prompt: "启动巡检：看看工作区当前状态，有问题用 todo 记下来处理，没问题直接 finish。"
      - id: weekday-morning
        cron: "0 9 * * 1-5"
        prompt: "工作日早班巡检：跑测试、看有没有未提交改动，汇总后 finish。"
      - id: nightly
        cron: "0 3 * * *"
        script: examples/config/scripts/nightly.sh
    sessionMode: fresh
    sessionID: cron
    output: text
    stream: false
    pollSeconds: 30
  deps:
    schedule: schedule.default
    workspace: workspace.default
    shell: shell.bash.default

schedule.default:
  use: schedule/file
  config:
    path: schedule.json
  deps:
    workspace: workspace.default

tools.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
  deps:
    hooks: hooks.default
    tools:
      - tool.read-file.default
      - tool.write-file.default
      - tool.edit-file.default
      - tool.grep.default
      - tool.find.default
      - tool.list-dir.default
      - tool.shell.default
      - tool.skill.default
      - tool.todo.default
      - tool.finish.default
      - tool.schedule.default
    policies:
      - policy.dangerous-shell.default
      - policy.path-denylist.default
      - policy.shell-allowlist.default
    approval: approval.auto-allow.default

tool.schedule.default:
  use: tool/schedule
  config:
    maxJobs: 16
  deps:
    schedule: schedule.default
