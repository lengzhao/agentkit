# 场景：在项目目录下 coding。
# workspace scope=local，session 与 skills 落在当前仓库。

workspace.default:
  use: workspace/default
  config:
    global: ~/.agentkit
    local: .
    scope: local

sessionStore.default:
  use: session/store
  config:
    dir: .agent/sessions
  deps:
    workspace: workspace.default

skills.default:
  use: skill/filesystem
  config:
    dirs:
      - local:skills
      - local:.cursor/skills
      - global:skills
  deps:
    workspace: workspace.default
