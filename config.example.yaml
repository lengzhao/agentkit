# 复制为 config.yaml 做本地 override（L1 覆盖 L0 config.base.yaml）。
# 同 use 的实例会深合并 config/deps；只写需要改的字段即可。
#
# L0（config.base.yaml）可保留完整插件图。未提供必要值的实例（如 ${env:SLACK_BOT_TOKEN}、${var:REQUIRED_URL}）
# 会在加载时自动清理；可选字段用 ${env:VAR:-} / ${var:VAR:-} / ${file:path:-}，缺失时展开为空字符串。
# 你只需为要启用的能力配置密钥和入口。
#
# L0 已默认启用 schedule/cron + tool/schedule，agent 可自主排期并在到期后触发 turn。
# L0 platform.default 为 platform/multiplex，聚合 CLI + 可选 Slack / 飞书 / Lark（见环境变量表）。

# 启用 IM 平台（设好对应环境变量后自动生效，无需改 platform 配置）：
#   SLACK_BOT_TOKEN + SLACK_APP_TOKEN
#   FEISHU_APP_ID + FEISHU_APP_SECRET
#   LARK_APP_ID + LARK_APP_SECRET
# 仅需 CLI 时无需任何操作；要 chat-api 时在 L1 把 platform.chat-api 加入 platform.default.deps.platforms。

# 示例：切换工作区 scope（global=~/.agentkit；local 默认同 global，项目 coding 可显式设 local: .agentkit）
workspace.default:
  use: workspace/default
  config:
    global: ~/.agentkit
    local: .agentkit
    scope: local

# 示例：从 .env 读取密钥（进程环境变量仍然优先）
# credentials.default:
#   use: credentials/env
#   config:
#     files:
#       - .env
#
# .env:
#   OPENAI_API_KEY=sk-...
#   LANGFUSE_PUBLIC_KEY=pk-lf-...
#   LANGFUSE_SECRET_KEY=sk-lf-...

# 示例：LLM 配置
#
# 方式一（推荐）：llm/fallback — 主模型失败时自动切换备用 model。
# 同 provider 只需一份 llm.openai；主 model 仍由 agent.config.model 决定。
llm.openai:
  use: llm/openai-compatible
  config:
    baseUrl: https://api.openai.com/v1
    apiKeyRef: env:OPENAI_API_KEY
    # 或直接写 apiKey: sk-...
  deps:
    credentials: credentials.default

llm.default:
  use: llm/fallback
  config:
    fallbackModels:
      - gpt-4o
      - gpt-4o-mini
    # fallbackOn: retryable   # 默认；也可 quota / any
  deps:
    provider: llm.openai

# 方式二：直接连单个 provider（无 fallback）
# llm.default:
#   use: llm/openai-compatible
#   config:
#     model: gpt-5.4
#     baseUrl: https://api.openai.com/v1
#     apiKeyRef: env:OPENAI_API_KEY
#   deps:
#     credentials: credentials.default
#
# 方式三：跨 provider fallback（不同 endpoint / 凭据）
# llm.anthropic:
#   use: llm/openai-compatible
#   config:
#     model: claude-sonnet-4
#     baseUrl: https://api.anthropic.com/v1
#     apiKeyRef: env:ANTHROPIC_API_KEY
#   deps:
#     credentials: credentials.default
#
# llm.default:
#   use: llm/fallback
#   config:
#     models:
#       - gpt-5.4
#       - claude-sonnet-4
#   deps:
#     fallbacks:
#       - llm.openai
#       - llm.anthropic
#
# llm.default 同时供 agent 与 compaction/summary 使用。

# 示例：自定义 Agent system prompt
# sections 按 deps 列表顺序拼进 system message。
#
prompt.default:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.custom.default
      - prompt.agents-md.default
      - prompt.skills.default
      - prompt.subagents.default
prompt.custom.default:
  use: prompt/section/static
  config:
    name: custom-instructions
    content: |
      你是一名资深 Go 工程师。
      - 优先最小化 diff，不做无关改动
      - 修改后运行测试再声称完成
      - 用中文回复
      - 用户要定时/延时提醒时，用 schedule 排期并在触发 prompt 里用 send 回传；未调用 schedule 不要声称已设置

