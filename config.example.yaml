# 复制为 config.yaml 做本地 override（L1 覆盖 L0 config.base.yaml）。
# 同 use 的实例会深合并 config/deps；只写需要改的字段即可。
#
# L0（config.base.yaml）可保留完整插件图。未提供必要值的实例（如 ${env:SLACK_BOT_TOKEN}、${var:REQUIRED_URL}）
# 会在加载时自动清理；可选字段用 ${env:VAR:-} / ${var:VAR:-} / ${file:path:-}，缺失时展开为空字符串。
# 你只需为要启用的能力配置密钥和入口。
#
# L0 已默认启用 schedule/cron + tool/schedule，agent 可自主排期并在到期后触发 turn。
# L0 platform.default 为 platform/multiplex，聚合 CLI + 可选 Slack / 飞书 / Lark（见环境变量表）。

# 启用 IM 平台（设好对应环境变量后自动生效，无需改 platform 配置）：
#   SLACK_BOT_TOKEN + SLACK_APP_TOKEN
#   FEISHU_APP_ID + FEISHU_APP_SECRET
#   LARK_APP_ID + LARK_APP_SECRET
# 仅需 CLI 时无需任何操作；要 chat-api 时在 L1 把 platform.chat-api 加入 platform.default.deps.platforms。

# 示例：切换工作区 scope（global=~/.agentkit，local=.agentkit）
workspace.default:
  use: workspace/default
  config:
    global: ~/.agentkit
    local: .agentkit
    scope: local

# Flat 密钥走 credentials.default；scopedEnv 只写在 credentials.integrations（写在 default 会被忽略）。
#
# 加密库路径 L0 已设 global:secrets.enc.json（local 即 .agentkit/secrets.enc.json），两处实例共用。
#
# 【0】解密口令（写 enc 前必配，勿提交仓库）
# export AGENTKIT_SECRETS_KEY='your-passphrase'
# credentials.default:
#   config:
#     env:
#       AGENTKIT_SECRETS_KEY: ${env:AGENTKIT_SECRETS_KEY}
# credentials.integrations:
#   config:
#     env:
#       AGENTKIT_SECRETS_KEY: ${env:AGENTKIT_SECRETS_KEY}
#
# 【1】Flat token — LLM / web-search（scope 为空，键名即 env 名）
# 方式 A：shell export（credentials.default 会读 process env）
#   export OPENAI_API_KEY=sk-...
#   export TAVILY_API_KEY=tvly-...
# 方式 B：L1 写进 config.env（适合 CI；仍走 credentials.default）
# credentials.default:
#   config:
#     env:
#       OPENAI_API_KEY: ${env:OPENAI_API_KEY}
#       ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY:-}
#       TAVILY_API_KEY: ${env:TAVILY_API_KEY:-}
# 方式 C：已用其他工具写入 secrets.enc.json 的 flat 条目 "OPENAI_API_KEY"（与 scoped 同文件）
#
# 【2】Scoped token — MCP / OpenAPI / bash（enc 键名 SCOPE::KEY；或 L1 scopedEnv，见下）
# 运行期写入 enc（需 AGENTKIT_SECRETS_KEY）：
#   /env add mcp.knowledge KNOWLEDGE_API_KEY=...
#   /env add shell-bash.gh GH_TOKEN=ghp_...
#
# L1 直接配 gh / npm token（推荐本地开发；首 token 自动对应 scope shell-bash.gh / shell-bash.npm）：
# credentials.integrations:
#   config:
#     env:
#       AGENTKIT_SECRETS_KEY: ${env:AGENTKIT_SECRETS_KEY}
#     scopedEnv:
#       shell-bash.gh:
#         GH_TOKEN: ${env:GH_TOKEN}
#       shell-bash.npm:
#         NPM_TOKEN: ${env:NPM_TOKEN}
# （L0 已 deps.credentials.integrations，无需再配 tool.shell-bash）
# bash 首 token 定 scope，注入该 scope 下已配置的全部变量，无需 config.commands。
#
# 【3】bash：仅有 scoped 密钥可注入时裁剪 env + token；其它命令仍为全量 os.Environ()。
# MCP/OpenAPI 的 mcp.json / api.json 只写 env:VAR 名；值用【2】。LLM 用【1】+ credentials.default。

# 示例：加密密钥库（与上【0】相同，可只保留一处 AGENTKIT_SECRETS_KEY）
# credentials.default:
#   config:
#     env:
#       AGENTKIT_SECRETS_KEY: ${var:AGENTKIT_SECRETS_KEY}
#
# credentials.integrations:
#   config:
#     encryptedFile: global:secrets.enc.json   # 与 L0 一致时可省略
#     env:
#       AGENTKIT_SECRETS_KEY: ${var:AGENTKIT_SECRETS_KEY}

# 示例：自定义 bash（tool/shell-bash）
# L0 已 deps.credentials.integrations；配置 token 后，gh/npm 等命令会裁剪 env 并注入变量，其它命令仍为全量 os.Environ()。
#
# credentials.integrations:
#   config:
#     scopedEnv:
#       shell-bash.gh:
#         GH_TOKEN: ${env:GH_TOKEN}
#       shell-bash.npm:
#         NPM_TOKEN: ${env:NPM_TOKEN}
#
# tool.shell-bash.default:
#   config:
#     workDir: work
#     timeoutSeconds: 120
#   # deps.credentials 已在 L0；仅需在 integrations 配 scopedEnv 或 /env add
#
# 命令首 token 为 gh / npm 时自动用 scope shell-bash.gh / shell-bash.npm，无需 commands 映射。
# 极少数情况可用 config.commands 覆盖要注入的变量名列表（一般不必）。
# 详见 docs/guides/credentials.zh.md。

# 示例：LLM 配置
#
# 方式一（推荐）：llm/fallback — 主模型失败时自动切换备用 model。
# 同 provider 只需一份 llm.openai；主 model 仍由 agent.config.model 决定。
# timeoutSeconds：流式首 token / TTFB 上限（默认 180）；后续 token 不限。
# responseHeaderTimeoutSeconds：连接 + 响应头（默认 60），与 timeoutSeconds 独立。
llm.openai:
  use: llm/openai-compatible
  config:
    baseUrl: https://api.openai.com/v1
    apiKeyRef: env:OPENAI_API_KEY
    # 或直接写 apiKey: sk-...
  deps:
    credentials: credentials.default

llm.default:
  use: llm/fallback
  config:
    fallbackModels:
      - gpt-4o
      - gpt-4o-mini
    # fallbackOn: retryable   # 默认；也可 quota / any
  deps:
    provider: llm.openai

# L0 的 hook/background-review 使用 llm.review（默认 baseUrl 为 api.openai.com）。
# 若主 LLM 走自建/代理网关，务必覆盖 review，否则易出现 401（同一 key 不能混用官方 endpoint）。
llm.review:
  extends: llm.openai
  config:
    model: gpt-5.4-mini

# 个人记忆（memory.md）与后台 review 写入门（L0 已挂 memory.default、hook.background-review、tool/memory）：
# memory.default:
#   config:
#     # memoryRoot: "."        # 默认：当前租户 local 根下的 memory.md
#     # memoryRoot: global:.   # 全 channel / 多租户共用一份 memory.md
#     review:
#       writeApproval: true    # background-review 的 memory 类 learn_capture 进 staged，用 /memory approve
#
# hook.background-review.default:
#   config:
#     memoryNotifications: off # on | verbose：会话内 💾 通知（需 platform sender）
#     # sessionRecall: false   # 关闭 review digest 里的跨会话 FTS 摘要
#     # memoryNudgeInterval: 0 # 0 = 关闭按轮次自动 review（仍可用主 agent memory 工具）
#
# learning.default 管 dreaming、workshop、/learn；记忆文件路径见 memory.default.config.memoryRoot。

# 方式二：直接连单个 provider（无 fallback）
# llm.default:
#   use: llm/openai-compatible
#   config:
#     model: gpt-5.4
#     baseUrl: https://api.openai.com/v1
#     apiKeyRef: env:OPENAI_API_KEY
#   deps:
#     credentials: credentials.default
#
# 方式三：跨 provider fallback（不同 endpoint / 凭据）
# llm.anthropic:
#   use: llm/openai-compatible
#   config:
#     model: claude-sonnet-4
#     baseUrl: https://api.anthropic.com/v1
#     apiKeyRef: env:ANTHROPIC_API_KEY
#   deps:
#     credentials: credentials.default
#
# llm.default:
#   use: llm/fallback
#   config:
#     models:
#       - gpt-5.4
#       - claude-sonnet-4
#   deps:
#     fallbacks:
#       - llm.openai
#       - llm.anthropic
#
# llm.default 同时供 agent 与 compaction/summary 使用。

# 示例：自定义 Agent system prompt
# sections 按 deps 列表顺序拼进 system message。
#
prompt.default:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.custom.default
      - prompt.agents-md.default
      - prompt.skills.default
      - prompt.subagents.default
prompt.custom.default:
  use: prompt/section/static
  config:
    name: custom-instructions
    content: |
      你是一名资深 Go 工程师。
      - 优先最小化 diff，不做无关改动
      - 修改后运行测试再声称完成
      - 用中文回复
      - 用户要定时/延时提醒时，用 schedule 排期并在触发 prompt 里用 send 回传；未调用 schedule 不要声称已设置

