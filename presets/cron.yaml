# L1 preset：常驻 cron 守护进程，且 agent 能给自己排期。
#
# 薄 overlay，能力栈从 autonomous.yaml 叠加：
#
#   go run ./cmd/agent -config presets/autonomous.yaml,presets/cron.yaml
#
# 单独用 `-config presets/cron.yaml` 且未链 autonomous 时，L0 无 auto-allow，policy ask 会走 Permission 等人 —
# 等人审批 —— 一定要跟 autonomous.yaml 一起链。
#
# 与 presets/daemon.yaml（platform/timer）的区别：timer 只支持固定间隔，这里支持
# 完整的 5 段 cron 表达式，能表达"工作日早上 9 点"这类日历型定时。
#
# 与系统 cron 的区别：进程内 cron 不抗机器重启，但换来两件系统 cron 做不到的事 ——
#   1. job 表是持久化的，agent 可以通过 tool/schedule 自己增删（"一小时后再看一眼"）
#   2. 不必为每次触发付进程启动 + 配置装配的开销
# 需要抗重启就把这个进程交给 systemd（Restart=always）。

runner.default:
  use: runner
  config:
    shutdownTimeoutSeconds: 10
    sessionScope: channel
  deps:
    platform: platform.default
    loop: loop.default
    schedules:
      - schedule.cron

platform.default:
  use: platform/worker
  config:
    tasks:
      # 启动时立刻跑一次，跑完 worker 退出；日历 job 由 schedule/cron 继续触发。
      - prompt: "启动巡检：看看工作区当前状态，有问题用 todo 记下来处理，没问题直接 finish。"
    sessionMode: fresh
    sessionID: cron
    output: text
    stream: false

schedule.cron:
  use: schedule/cron
  config:
    jobs:
      # cron 为 5 段式（分 时 日 月 周），也支持 @hourly / @daily / @weekly / @monthly / @yearly。
      - id: weekday-morning
        cron: "0 9 * * 1-5"
        prompt: "工作日早班巡检：跑测试、看有没有未提交改动，汇总后 finish。"
      # script 模式示例（与 prompt 互斥）：直接跑 bash，不经过 agent
      # - id: nightly
      #   cron: "0 3 * * *"
      #   script: presets/scripts/nightly.sh
      - id: nightly
        cron: "0 3 * * *"
        prompt: "夜间巡检：检查依赖与构建是否正常，有问题记 todo 并处理。"
    sessionMode: fresh
    sessionID: cron
    pollSeconds: 30
  deps:
    schedule: schedule.default
    workspace: workspace.default

# job 表落在工作区里，agent 加的 job 因此能跨重启存活。
# 写入走临时文件 + rename：进程在写一半时被杀，回来不会读到截断的 job 表。
schedule.default:
  use: schedule/multi
  config:
    path: schedule.json
  deps:
    workspace: workspace.default

# 把 tool/schedule 挂给 agent —— 与 schedule/cron 共用同一个 registry，
# 所以 agent 新加的 job 不重启就会被拾起，且跨重启存活。
tools.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
  deps:
    hooks: hooks.default
    tools:
      - tool.shell-bash.default
      - tool.skill.default
      - tool.todo.default
      - tool.finish.default
      - tool.schedule.default
    toolPacks:
      - tool.fs-workspace.default
    dynamicTools:
      - mcp.default
    policies:
      - policy.dangerous-shell.default
      - policy.path-denylist.default
      - policy.shell-allowlist.default
    approval: approval.auto-allow.default

tool.schedule.default:
  use: tool/schedule
  config:
    # agent 自己能排的 job 上限，防止跑飞的 agent 把日历填满。
    # config 里声明的 job 不占这个额度。
    maxJobs: 16
  deps:
    schedule: schedule.default
