# L1 preset：网络能力（搜索 + 抓取 + 向用户提问）。
#
#   export EXA_API_KEY=...          # 只有搜索需要 key
#   go run ./cmd/agent -config presets/web.yaml "查一下 xxx 的官方文档怎么说，给我结论并附来源"
#
# 设计约定：
#   1. tool/web-fetch-http 不需要任何凭据；tool/web-search-exa 缺 key 不阻断构造，调用时返回可读错误。
#   2. 私网地址默认禁止，在 tool/web-fetch-http 的 dial 路径拦截。
#   3. ask_user 超时单独放宽；headless platform 自动降级为 answered:false。

# 整颗覆盖 tools.default：在 L0 那批工具之外加上网络/提问工具。
tools.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
    toolTimeouts:
      delegate: 900
      ask_user: 900
  deps:
    hooks: hooks.default
    tools:
      - tool.fs-workspace.default
      - tool.shell-bash.default
      - tool.skill.default
      - tool.subagent.default
      - tool.web-fetch-http.default
      - tool.web-search-exa.default
      - tool.ask-user.default
    policies:
      - policy.dangerous-shell.default
    approval: approval.cli.default

tools.subagent.default:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
  deps:
    hooks: hooks.default
    tools:
      - tool.fs-workspace.readonly.default
      - tool.finish.default
      - tool.web-fetch-http.default
      - tool.web-search-exa.default
    policies:
      - policy.dangerous-shell.default
    approval: approval.cli.default
