# 扁平实例图：顶层 key 即 instance id，deps 用字符串引用其它实例。
# 文件/S shell 边界见 docs/coding-workspace.zh.md
# pluginkit 会从 runner 出发解析依赖并拓扑构建。

runner:
  use: runner
  config:
    shutdownTimeoutSeconds: 10
  deps:
    platform: platform
    loop: loop

platform:
  use: platform/cli
  config:
    once: false
  deps:
    commands: commands

commands:
  use: command/registry
  deps:
    handlers:
      - command.compact
      - command.new
      - command.session

command.compact:
  use: command/compact
  config:
    agentId: coder
  deps:
    sessionStore: sessionStore
    services:
      - compaction.prune
      - compaction.summary

command.new:
  use: command/new

command.session:
  use: command/session
  deps:
    sessionStore: sessionStore

loop:
  use: loop/default
  deps:
    agents:
      - agent.coder

agent.coder:
  use: agent/coding
  config:
    id: coder
    model: gpt-5.4
    maxSteps: 20
  deps:
    sessionStore: sessionStore
    llm: llm
    hooks: hooks
    prompt: prompt
    tools: tools
    compaction:
      - compaction.prune
      - compaction.summary

sessionStore:
  use: session/store
  config:
    dir: .agent/sessions

credentials:
  use: credentials/env

llm:
  use: llm/openai-compatible
  config:
    model: gpt-5.4
    baseUrl: https://api.openai.com/v1
    apiKeyRef: env:OPENAI_API_KEY
  deps:
    credentials: credentials

hooks:
  use: hooks/runtime
  deps:
    providers:
      - hook.before-step

hook.before-step:
  use: hook/before-step
  deps:
    sessionStore: sessionStore
    services:
      - compaction.prune
      - compaction.summary

compaction.prune:
  use: compaction/prune-tool-results
  config:
    maxToolResultBytes: 8192

compaction.summary:
  use: compaction/summary
  config:
    minMessages: 30
    keepRecent: 8
    retry:
      enabled: true
      maxRetries: 3
      baseDelayMs: 2000
  deps:
    llm: llm.summary

llm.summary:
  use: llm/openai-compatible
  config:
    model: gpt-5.4
    baseUrl: https://api.openai.com/v1
    apiKeyRef: env:OPENAI_API_KEY
  deps:
    credentials: credentials

prompt:
  use: prompt/assembler/default
  deps:
    sections:
      - prompt.agents-md
      - prompt.skills

prompt.agents-md:
  use: prompt/section/agents-md
  config:
    root: .

prompt.skills:
  use: prompt/section/skills
  deps:
    skills: skills

skills:
  use: skill/filesystem
  config:
    dirs:
      - .cursor/skills
      - skills

tools:
  use: tools/runtime
  config:
    defaultTimeoutSeconds: 120
    maxResultBytes: 8192
  deps:
    hooks: hooks
    tools:
      - tool.read-file
      - tool.write-file
      - tool.edit-file
      - tool.grep
      - tool.find
      - tool.list-dir
      - tool.shell
      - tool.skill
    policies:
      - policy.dangerous-shell
    approval: approval.cli

tool.read-file:
  use: tool/read-file
  config:
    maxBytes: 1048576
  deps:
    fs: fs.workspace.readonly

tool.write-file:
  use: tool/write-file
  deps:
    fs: fs.workspace

tool.edit-file:
  use: tool/edit-file
  deps:
    fs: fs.workspace

tool.grep:
  use: tool/grep
  deps:
    fs: fs.workspace.readonly

tool.find:
  use: tool/find
  deps:
    fs: fs.workspace.readonly

tool.list-dir:
  use: tool/list-dir
  deps:
    fs: fs.workspace.readonly

tool.shell:
  use: tool/shell
  deps:
    shell: shell.bash

tool.skill:
  use: tool/skill
  deps:
    skills: skills
    sessionStore: sessionStore

fs.workspace:
  use: fs/local
  config:
    root: .

fs.workspace.readonly:
  use: fs/readonly
  deps:
    fs: fs.workspace

shell.bash:
  use: shell/bash
  config:
    workDir: .
    timeoutSeconds: 60

policy.dangerous-shell:
  use: policy/deny-dangerous-shell

approval.cli:
  use: approval/cli
