# L1 preset：在项目目录下 coding（覆盖 L0 config.base.yaml 中的对应实例）。

workspace.default:
  use: workspace/default
  config:
    scope: local

sessionStore.default:
  use: session/store
  config:
    dir: sessions
  deps:
    workspace: workspace.default

# local 根为 .agentkit；fs/shell 默认读写该根（root: .）与 work/ 子目录。
mcp.default:
  config:
    enableLocal: true
    files:
      - local:mcp.json
      - global:mcp.json

openapi.default:
  config:
    enableLocal: true
    files:
      - local:api.json
      - global:api.json

skills.default:
  use: skill/filesystem
  config:
    dirs:
      - local:../skills
      - local:skills
      - local:../.cursor/skills
      - global:skills
  deps:
    workspace: workspace.default
