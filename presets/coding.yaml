# L1 preset：在项目目录下 coding（覆盖 L0 config.base.yaml 中的对应实例）。

workspace.default:
  use: workspace/default
  config:
    scope: local

sessionStore.default:
  use: session/store
  config:
    dir: sessions
  deps:
    workspace: workspace.default

# local 根为 .agentkit；文件工具与 shell 通过 .. 落到项目根目录。
fs.workspace.default:
  use: fs/local
  config:
    root: ..
  deps:
    workspace: workspace.default

shell.bash.default:
  use: shell/bash
  config:
    workDir: ..
  deps:
    workspace: workspace.default

skills.default:
  use: skill/filesystem
  config:
    dirs:
      - local:skills
      - local:../.cursor/skills
      - global:skills
  deps:
    workspace: workspace.default
