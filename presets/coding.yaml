# L1 preset：在项目目录下 coding（覆盖 L0 config.base.yaml 中的对应实例）。

workspace.default:
  use: workspace/default
  config:
    scope: local

sessionStore.default:
  use: session/store
  config:
    dir: sessions
  deps:
    workspace: workspace.default

# local 根为 .agentkit；文件工具与 shell 通过 .. 落到项目根目录。
tool.fs-workspace.default:
  use: tool/fs-workspace
  config:
    root: ..
    maxBytes: 1048576
  deps:
    workspace: workspace.default

tool.shell-bash.default:
  use: tool/shell-bash
  config:
    workDir: ..
    timeoutSeconds: 60
  deps:
    workspace: workspace.default

skills.default:
  use: skill/filesystem
  config:
    dirs:
      - local:../skills
      - local:skills
      - local:../.cursor/skills
      - global:skills
  deps:
    workspace: workspace.default
