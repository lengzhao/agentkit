# L1 preset：在项目目录下 coding（覆盖 L0 config.base.yaml 中的对应实例）。

workspace.default:
  use: workspace/default
  config:
    global: ~/.agentkit
    local: .
    scope: local

sessionStore.default:
  use: session/store
  config:
    dir: .agent/sessions
  deps:
    workspace: workspace.default

skills.default:
  use: skill/filesystem
  config:
    dirs:
      - local:skills
      - local:.cursor/skills
      - global:skills
  deps:
    workspace: workspace.default
