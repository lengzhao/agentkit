# L1：飞书 WebSocket + coding agent
# 国际版 Lark：将 use 改为 platform/lark，domain 设为 https://open.larksuite.com

runner.default:
  use: runner
  config:
    shutdownTimeoutSeconds: 10
    maxConcurrentTurns: 4
    # sessionScope: channel # channel（默认）| thread | user；折叠 platform delivery SessionID
  deps:
    platform: platform.default
    loop: loop.default

platform.default:
  use: platform/feishu
  config:
    appId: "cli_REPLACE_ME"
    appSecret: "REPLACE_ME"
    # agentId: "" # 可选：路由到指定 Agent；留空使用 loop.defaultAgent
    # domain: "https://open.feishu.cn" # Lark：https://open.larksuite.com
    allowFrom: ""
    # allowChat: "" # 群聊 chat_id 白名单，逗号分隔；空=全部
    groupReplyAll: false # false：群内仅 @ 机器人时响应
    # threadIsolation: false # true：群话题在 delivery SessionID 中带 :t:<rootID>
    # replyInThread: true # false：群聊出站不创建/进入话题；私聊始终平铺回复
    # reactionEmoji: OnIt # 默认 OnIt；none 关闭
    # doneEmoji: CheckMark # 默认 CheckMark；none 关闭
    # groupOnly: false # true：仅群聊，忽略私聊
    # respondToAtEveryoneAndHere: false # @_all 无 mention 时也响应
    # replyToTrigger: true # false：出站不引用原消息（Im.Message.Create）
    # resolveMentions: false # 出站 @用户名 解析为飞书 at
    # enableFeishuCard: true # 流式 Interactive Card（message/update Patch）
    # progressStyle: card # legacy | compact | card；card/compact 时整轮复用一张卡片原地更新
    # showThinking: false # card/compact 下是否在进度区展示 thinking
    # showToolProgress: true # card/compact 下是否展示 tool 调用进度
    # peerBots: {} # app_id -> 别名，引用链中识别其他 bot
    # encryptKey: "" # 非空时走 webhook（Lark 国际版常用），见 port / callbackPath
    # port: "8080"
    # callbackPath: /feishu/webhook
  deps:
    commands: commands.default
    sessionStore: sessionStore.default
    workspace: workspace.default

workspace.default:
  use: workspace/default
  config:
    scope: local

sessionStore.default:
  use: session/store
  config:
    dir: sessions
  deps:
    workspace: workspace.default
