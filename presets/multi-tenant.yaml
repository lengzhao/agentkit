# L1 preset：多租户 IM 接入（Slack 等群聊）。
#
# 三条隔离语义各由一处负责，互不牵连：
#
#   会话隔离   —— runner.config.sessionScope 折叠 platform delivery SessionID，
#                得到 effective SessionID；Loop 按 effective 串行加锁，session/store 一 ID 一 JSONL。
#   用户识别   —— MessageEvent.UserID 落在 user 消息的事件信封上，
#                回放时渲染成 <user id="U123">，同一个群里谁说的话分得清。
#   工作目录   —— cap/tenant 从 effective SessionID 推出租户键（平台段 + 第一个路由段），
#                workspace/tenant 按租户键给出 local 根。
#
# 关键性质：三种 sessionScope（channel / thread / user）都落在同一个租户键上，
# 所以「历史切多细」与「在哪个目录干活」可以分别决定。
#
# 本 preset 只装内核。入站 platform 需自行接入（platform/slack 尚未实现），
# platform 侧只需两件事：用 session.BuildDeliverySessionID 生成 delivery SessionID，
# 并在 MessageEvent.UserID 填上发言人。sessionScope 由 runner 配置，默认 channel。

workspace.default:
  use: workspace/tenant
  config:
    # 全租户共享的根：技能库、子 agent 定义、公共 mcp.json 放这里（global: 前缀）。
    global: ~/.agentkit
    # 每个租户一个子目录：~/.agentkit/tenants/slack_C123ABC。
    # 没在 tenants 里列出的群走这条默认规则 —— 新群接进来零配置，默认就是隔离的。
    localBase: ~/.agentkit/tenants
    # 不带前缀的路径落在调用方自己的租户根下。
    scope: local
    # 只有需要把某个群钉到已有项目目录时才列出来。
    # 键是租户键（平台段 + 频道），不是 SessionID：该频道下所有 thread、所有人共用这一条。
    # local 根指向项目下的 .agentkit/，运行时数据与项目源码分开；工具在 work/ 子目录操作。
    # YAML 里键含冒号，必须加引号。
    tenants: {}
    # tenants:
    #   "slack:C123ABC":
    #     root: ~/work/project-a/.agentkit
    #   "slack:C456DEF":
    #     root: ~/work/project-b/.agentkit

# 租户根（local）放运行时数据：sessions、agents、mcp.json、skills 等。
# 文件工具与 shell 只在 work/ 子目录读写，避免误伤 session 或配置。
# workspace/tenant 禁止 ".." 越出 local/global 根；tool/fs 还会再拦一层 "../" 逃出 work/。
tool.fs-workspace.default:
  use: tool/fs-workspace
  config:
    root: work
    maxBytes: 1048576
  deps:
    workspace: workspace.default

tool.shell-bash.default:
  use: tool/shell-bash
  config:
    workDir: work
    timeoutSeconds: 60
  deps:
    workspace: workspace.default

# AGENTS.md 从 tool 工作区向上搜，与 fs/shell 对齐。
prompt.agents-md.default:
  use: prompt/section/agents-md
  config:
    root: work
  deps:
    workspace: workspace.default

# 每个租户一份 sessions/ ，落在自己的根下。
sessionStore.default:
  use: session/store
  config:
    dir: sessions
  deps:
    workspace: workspace.default

# 租户私有技能 + 全局共享技能库。
skills.default:
  use: skill/filesystem
  config:
    dirs:
      - local:skills
      - global:skills
  deps:
    workspace: workspace.default

runner.default:
  use: runner
  config:
    shutdownTimeoutSeconds: 10
    sessionScope: channel
  deps:
    platform: platform.default
    loop: loop.default
