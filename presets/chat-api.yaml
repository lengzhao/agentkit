# L1：chat-api HTTP + SSE + coding agent

runner.default:
  use: runner
  config:
    shutdownTimeoutSeconds: 10
    maxConcurrentTurns: 8
  deps:
    platform: platform.default
    loop: loop.default
    sessionStore: sessionStore.default

platform.default:
  use: platform/chat-api
  config:
    listenAddr: ":8030"
    path: /v1/
    apiToken: ""
    busyPolicy: queue
    debugUi: true
    # agents: ["assistant"] # 可选：调试页 Agent 下拉
  deps:
    commands: commands.default
    sessionStore: sessionStore.default
    workspace: workspace.default

workspace.default:
  use: workspace/tenant
  config:
    global: ~/.agentkit
    localBase: .agentkit
    scope: local
    # 目录名不带 platform 前缀：slack:C123 -> .agentkit/C123
    omitPlatformPrefix: true

mcp.default:
  config:
    enableLocal: true
    files:
      - local:mcp.json
      - global:mcp.json

openapi.default:
  config:
    enableLocal: true
    files:
      - local:api.json
      - global:api.json

sessionStore.default:
  use: session/store
  config:
    dir: sessions
  deps:
    workspace: workspace.default
