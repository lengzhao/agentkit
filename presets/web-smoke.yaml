# L1 overlay：网络能力冒烟（scripted LLM + scripted web tool，不需要 API Key）。
# 叠在 web.yaml 之上：
#
#   go run ./cmd/agent -config presets/web.yaml,presets/web-smoke.yaml "loop 怎么保证同一 session 串行？"

platform.default:
  use: platform/cli
  config:
    once: true
  deps:
    commands: commands.default

tool.web-fetch-http.default:
  use: tool/web-fetch-scripted
  config:
    pages:
      /docs/loop: |
        <html><head><title>Loop 并发模型</title></head><body>
        <h1>Loop 并发模型</h1>
        <p>loop/default 按 SessionID 取锁，同一 session 的 turn 串行执行。</p>
        <p>跨 session 的并行度由 runner 的 maxConcurrentTurns 决定，默认 1。</p>
        <script>这段不该出现在抓取结果里</script>
        </body></html>
    default: "<p>这个 URL 没有脚本页面。</p>"

tool.web-search-tavily.default:
  use: tool/web-search-scripted
  config:
    byQuery:
      loop:
        - title: "Loop 并发模型"
          url: "https://example.com/docs/loop"
          snippet: "同一 session 的 turn 串行执行"
        - title: "Runner 分发"
          url: "https://example.com/docs/runner"
          snippet: "跨 session 可并行，上限由 maxConcurrentTurns 控制"
    results:
      - title: "AgentKit 文档首页"
        url: "https://example.com/docs"
        snippet: "Go Agent Harness 运行时"

llm.default:
  use: llm/scripted
  config:
    steps:
      - text: "先搜一下。"
        toolCalls:
          - id: call-search
            name: web_search
            input: '{"query":"agentkit loop 同一 session 串行"}'
      - text: "第一条命中最相关，抓正文确认。"
        toolCalls:
          - id: call-fetch
            name: web_fetch
            input: '{"url":"https://example.com/docs/loop"}'
      - text: "结论要不要连 runner 的并发上限一起讲，问一下。"
        toolCalls:
          - id: call-ask
            name: ask_user
            input: '{"question":"结论要不要一并说明跨 session 的并发上限？","options":["要","不要"],"default":"要"}'
      - text: "没人可答，按更完整的那个口径给结论：loop/default 按 SessionID 取锁，同一 session 的 turn 串行；跨 session 的并行度由 runner.maxConcurrentTurns 控制，默认 1。来源：https://example.com/docs/loop"
