# L1 preset：无 API Key 冒烟（scripted LLM，覆盖 runner / session 相关实例）。

runner.default:
  use: runner
  deps:
    platform:
      use: platform/cli
      config:
        once: true
    loop:
      use: loop/default
      deps:
        agents:
          - use: agent/coding
            config:
              id: smoke
              maxSteps: 5
            deps:
              sessionStore: sessionStore.default
              workspace: workspace.default
              llm:
                use: llm/scripted
                config:
                  steps:
                    - text: "当前目录内容需要通过 bash 工具列出，然后用 read 读取 README.md"
                      toolCalls:
                        - id: call-ls
                          name: bash
                          input: '{"command":"ls -la"}'
                    - text: "已完成目录列表。"
                      toolCalls:
                        - id: call-read
                          name: read
                          input: '{"path":"README.md"}'
                    - text: "README 已读取完毕。"
              prompt:
                use: prompt/assembler/default
              tools:
                use: tools/runtime
                deps:
                  toolPacks:
                    - use: tool/fs-memory
                      config:
                        files:
                          README.md: "# AgentKit\n\nhello"
                  tools:
                    - use: tool/shell-bash
                      config:
                        workDir: .
                        timeoutSeconds: 30
                      deps:
                        workspace: workspace.default
                  policies:
                    - use: policy/deny-dangerous-shell

session.default:
  use: session/memory
  config:
    id: cli:default

sessionStore.default:
  use: session/static
  deps:
    session: session.default

workspace.default:
  use: workspace/default
  config:
    local: .agentkit
    scope: local
